name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'

      - name: Create Android Project (Fix Gradle)
        run: |
          # Simpan code kamu
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          # Bikin folder android yang hilang
          flutter create . --platforms=android --project-name=shochateyo --org=com.shochateyo --overwrite
          # Balikin code kamu
          cp /tmp/pubspec.yaml ./pubspec.yaml
          cp /tmp/main.dart ./lib/main.dart

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShochaTeyo-APK
          path: build/app/outputs/flutter-apk/app-release.apk
